name: Responder pedidos (@Meupcba_bot)

on:
  schedule:
    - cron: "*/5 * * * *"   # confere mensagens a cada 5 minutos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pcba-bot
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler mensagens e responder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARGO: ${{ vars.CARGO || 'ambos' }}
        run: python responder.py
      - name: Guardar estado
        if: always()
        run: |
          git add dados
          if [ -n "$(git status --porcelain --cached dados)" ]; then
            git config user.name "pcba-bot"
            git config user.email "pcba-bot@users.noreply.github.com"
            git commit -q -m "Estado do @Meupcba_bot"
            git pull -q --rebase origin main && git push -q
          fi
