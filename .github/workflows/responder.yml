name: Responder pedidos (@Meupcba_bot)

# Cada execução fica escutando o Telegram por ~5h30 e responde em segundos.
# O agendamento a cada 30 min garante que a próxima execução já esteja na fila
# quando a anterior terminar (o grupo de concorrência impede duas ao mesmo tempo).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pcba-bot
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escutar e responder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARGO: ${{ vars.CARGO || 'ambos' }}
        run: python responder.py --escutar 330
      - name: Guardar estado
        if: always()
        run: |
          git add dados
          if ! git diff --cached --quiet -- dados; then
            git config user.name "pcba-bot"
            git config user.email "pcba-bot@users.noreply.github.com"
            git commit -q -m "Estado do @Meupcba_bot"
            git pull -q --rebase origin main && git push -q
          fi
