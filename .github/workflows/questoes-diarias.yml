name: Envio diário PC-BA (desativado)

# O envio automático diário foi desligado a pedido: agora as questões só chegam
# quando você manda "estudo" ao @Meupcba_bot (ver responder.yml).
# Para religar, devolva o bloco abaixo para dentro de "on:":
#   schedule:
#     - cron: "47 9 * * *"   # 06:47 em Salvador
on:
  workflow_dispatch: {}

permissions:
  contents: write   # para guardar o chat id descoberto em dados/chat_id.txt

concurrency:
  group: pcba-bot
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar questões do dia para @Meupcba_bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_USUARIO: Meupcba_bot
          CARGO: ${{ vars.CARGO || 'ambos' }}
          QUESTOES_POR_DIA: ${{ vars.QUESTOES_POR_DIA || '3' }}
          DATA_INICIO: ${{ vars.DATA_INICIO || '2026-10-12' }}
          DATA_PROVA: "2026-12-06"
        run: python enviar.py
      - name: Guardar chat id e resultado da execução
        if: always()
        run: |
          git add dados
          if ! git diff --cached --quiet -- dados; then
            git config user.name "pcba-bot"
            git config user.email "pcba-bot@users.noreply.github.com"
            git commit -m "Registro da execução do @Meupcba_bot"
            git pull -q --rebase origin main && git push
          fi
