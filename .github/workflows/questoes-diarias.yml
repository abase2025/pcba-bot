name: Questões diárias PC-BA (@Meupcba_bot)

on:
  schedule:
    # 09:47 UTC = 06:47 em Salvador (UTC-3), todos os dias
    - cron: "47 9 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para testar na hora

permissions:
  contents: write   # para guardar o chat id descoberto em dados/chat_id.txt

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar questões do dia para @Meupcba_bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_USUARIO: Meupcba_bot
          CARGO: ${{ vars.CARGO || 'ambos' }}
          QUESTOES_POR_DIA: ${{ vars.QUESTOES_POR_DIA || '3' }}
          DATA_INICIO: ${{ vars.DATA_INICIO || '2026-10-12' }}
          DATA_PROVA: "2026-12-06"
        run: python enviar.py
      - name: Guardar chat id e resultado da execução
        if: always()
        run: |
          git add dados
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "pcba-bot"
            git config user.email "pcba-bot@users.noreply.github.com"
            git commit -m "Registro da execução do @Meupcba_bot"
            git push
          fi
